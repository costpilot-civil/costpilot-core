[project]
name = "costpilot-core"
version = "0.1.0"
description = "Reusable core logic and shared domain models for CostPilot."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costpilot_core"]
